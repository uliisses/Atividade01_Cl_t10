name: Validação do Projeto

on:
  push:
    branches:
      - '**'

jobs:
  validar:
    name: Validar projeto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Exibir informações da execução
        run: |
          echo "Repositório: ${{ github.repository }}"
          echo "Usuário que iniciou a execução: ${{ github.actor }}"

      - name: Verificar existência do README.md
        run: |
          if [ -f "README.md" ]; then
            echo "✅ README.md encontrado."
          else
            echo "::error::❌ O arquivo README.md não foi encontrado."
            exit 1
          fi

      - name: Validação concluída
        run: echo "🎉 Validação do projeto concluída com sucesso!"